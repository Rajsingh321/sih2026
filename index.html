<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FasalBazaar — Fresh Produce Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-main">FasalBazaar</span>
        <span class="logo-tag">Farm to Business</span>
      </div>

      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" aria-label="Search products">
        <button class="search-btn" id="searchBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>

      <nav class="header-actions">
        <button class="header-link">Bulk Orders</button>
        <button class="header-link" id="ordersBtn">Orders</button>
        <button class="cart-btn" id="cartBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Cart
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </nav>
    </div>

    <!-- Category strip -->
    <div class="category-strip" id="categoryStrip"></div>
  </header>

  <!-- Offer banner -->
  <div class="banner-strip">
    <div class="banner-item">🌾 Direct from 40+ Farmer Hubs</div>
    <div class="banner-item">🚚 Same-Day Hub Dispatch</div>
    <div class="banner-item">✅ Grade-A Quality Assured</div>
    <div class="banner-item">💰 No Middleman Markup</div>
  </div>

  <!-- Main -->
  <main class="main">
    <div class="results-bar">
      <span id="resultsCount">Showing all upaj</span>
      <select id="sortSelect" class="sort-select">
        <option value="relevance">Sort: Relevance</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="fresh">Freshest First</option>
      </select>
    </div>

    <div class="product-grid" id="productGrid"></div>
    <p class="empty-state" id="emptyState" hidden>No upaj matched your search. Try "aloo" or "wheat".</p>
  </main>

  <!-- Product Quick View Modal -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="productModal"></div>
  </div>

  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cartOverlay" hidden></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-btn" id="closeCart">&times;</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter">
      <div class="cart-row">
        <span>Subtotal</span>
        <span id="cartSubtotal">₹0</span>
      </div>
      <div class="cart-row muted-row">
        <span>Delivery from hub</span>
        <span id="cartDelivery">₹0</span>
      </div>
      <div class="cart-row total-row">
        <span>Total</span>
        <span id="cartTotal">₹0</span>
      </div>
      <button class="place-order-btn" id="placeOrderBtn">PLACE ORDER</button>
    </div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="backend.js"></script>
</body>
</html>
